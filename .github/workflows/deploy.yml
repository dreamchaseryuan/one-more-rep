name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 纯文档改动不触发部署。
    #
    # 一次部署要拉 130 MB 媒体再构建，改个错别字也跑一遍是纯浪费。
    # 注意 paths-ignore 的语义是「**所有**改动文件都匹配才跳过」——
    # 只改文档才跳过；只要碰了 src/、data/、scripts/、public/ 或这个 workflow 本身，照样部署。
    #
    # data/*.json 是构建输入（programs / warmups / name_zh），**故意不在这里**。
    # 手动重跑不受影响，workflow_dispatch 是独立触发器，随时可以在 Actions 页面点。
    paths-ignore:
      - '**.md'
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      # LICENSE 在仓库根目录、不在 public/ 里，所以它不进构建产物 —— 改许可不需要重新部署
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 不在这里设 workflow 级 concurrency。
#
# 设成 `group: pages, cancel-in-progress: false`（GitHub 官方 Pages 模板的写法）时，
# 后一次推送会**整个排队等**前一次跑完 —— 前一次照样把 130 MB 媒体拉完、构建完，
# 结果注定被覆盖。连推三次就是三次完整构建，白下 260 MB。
#
# 改成按 job 分开控制：**构建可以掐，部署不能掐**。
# 取消一个正在进行的构建没有任何后果（它的产物本来就会被后一次盖掉），
# 而取消一个正在进行的部署会留下不一致的环境 —— 这正是官方模板写 false 的原因。

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build
      cancel-in-progress: true # 后一次推上来，前一次还在跑的构建直接取消
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 测试放在拉媒体之前：测试只要几百毫秒，而下面两步要下 130 MB。
      # 顺序反过来的话，测试挂了会先把 130 MB 白拉一遍才失败。
      #
      # 挂在 build 之前而不是塞进 build 脚本里：日志里能一眼区分「测试挂了」和「构建挂了」。
      # 它挡的不只是质量问题——是**静默算错**那一类 bug（时区差一天、预填被当成实际做了、
      # 插一个训练日后轮转错位），这类错不报错，只会让错误数据进历史。
      - run: npm test

      # 媒体（缩略图 8.5 MB + GIF 122 MB）不进仓库 —— 否则每次 CI 都要 checkout 140 MB。
      # 构建时现拉，打进 dist，部署产物照样自包含。CI 在 GitHub 内网，不受国内网络影响。
      - run: npm run media:fetch
      - run: npm run media:fetch-videos

      # build 脚本里已经含 tsc --noEmit，类型不过就直接失败，不会发出去
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 部署串行、且**绝不中途取消** —— 这是官方 Pages 模板那条 `cancel-in-progress: false`
    # 真正想保护的东西，只是它写在了 workflow 级、连构建一起保护了。
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
