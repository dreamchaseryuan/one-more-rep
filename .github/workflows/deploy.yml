name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # 纯文档改动不触发部署。
    #
    # 一次部署要拉 130 MB 媒体再构建，改个错别字也跑一遍是纯浪费。
    # 注意 paths-ignore 的语义是「**所有**改动文件都匹配才跳过」——
    # 只改文档才跳过；只要碰了 src/、data/、scripts/、public/ 或这个 workflow 本身，照样部署。
    #
    # data/*.json 是构建输入（programs / warmups / name_zh），**故意不在这里**。
    # 手动重跑不受影响，workflow_dispatch 是独立触发器，随时可以在 Actions 页面点。
    paths-ignore:
      - '**.md'
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连着推两次时，让后一次等前一次结束，别互相覆盖部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 媒体（缩略图 8.5 MB + GIF 122 MB）不进仓库 —— 否则每次 CI 都要 checkout 140 MB。
      # 构建时现拉，打进 dist，部署产物照样自包含。CI 在 GitHub 内网，不受国内网络影响。
      - run: npm run media:fetch
      - run: npm run media:fetch-videos

      # build 脚本里已经含 tsc --noEmit，类型不过就直接失败，不会发出去
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
