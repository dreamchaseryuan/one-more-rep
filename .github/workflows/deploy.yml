name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 连着推两次时，让后一次等前一次结束，别互相覆盖部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 媒体（缩略图 8.5 MB + GIF 122 MB）不进仓库 —— 否则每次 CI 都要 checkout 140 MB。
      # 构建时现拉，打进 dist，部署产物照样自包含。CI 在 GitHub 内网，不受国内网络影响。
      - run: npm run media:fetch
      - run: npm run media:fetch-videos

      # build 脚本里已经含 tsc --noEmit，类型不过就直接失败，不会发出去
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
